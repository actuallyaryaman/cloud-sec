[project]
name = "cloudsec-agent"
version = "0.1.0"
description = "Cloud security agent research project"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "google-genai>=2.29.0",
    "openai>=3.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
